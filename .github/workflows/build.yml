name: Compilar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas y WebApp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroDesign-webapp
          path: dist
          if-no-files-found: error
      - run: npm run build:html
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroDesign-html
          path: dist-html/ElectroDesign.html
          if-no-files-found: error

  linux:
    name: Linux (AppImage y tar.gz)
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: ElectroDesign-linux
          path: |
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error

  publicar:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pruebas, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Empaquetar la WebApp
        run: cd artefactos/ElectroDesign-webapp && zip -r ../ElectroDesign-webapp.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artefactos/ElectroDesign-linux/*
            artefactos/ElectroDesign-webapp.zip
            artefactos/ElectroDesign-html/ElectroDesign.html
